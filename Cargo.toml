[workspace]
resolver = "3"
members = [
    # x86_64
    "games-64/acu-patches/core",
    "games-64/acu-patches/standalone",
    "games-64/acu-patches/plugin",
    "games-64/acs-patches",
    "games-64/mesom-patches",
    "games-64/mesow-patches",
    "games-64/wd-patches",
    "games-64/lswtss-patches",

    # x86
    "games-32/fc3-patches",
    "games-32/fc3bd-patches",
    "games-32/sodyose-patches",

    # Shared
    "framework",
]
default-members = ["framework"]

[workspace.dependencies]
assert-offset = "0.1.2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
enable-ansi-support = "0.3"
toml = "1"
serde = { version = "1.0", features = ["derive"] }
libmem = "5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Wdk_System_Threading",
] }

[profile.release]
lto = "fat"
